# One Browser Use Cloud browser and Playwright MCP 0.0.85 on it, served as MCP tools (browser_site.py).
type = "website"
environment_name = "bu-browser-site"
domains = ["bu-browser.localhost"]
ready_timeout_s = 180
backend_image = { dockerfile = "Dockerfile" }

[settings]
# Resolved only as the site's container is written, from agent-env's secret store ([stores.secret]).
api_key = "secret:BROWSER_USE_API_KEY"
proxy_country_code = "us"
timeout_minutes = 30
